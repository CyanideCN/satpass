[package]
name = "satpass"
version = "0.1.0"
edition = "2024"

[lib]
name = "satpass"
crate-type = ["rlib", "cdylib"]

[features]
default = []
python = ["dep:pyo3", "pyo3/extension-module"]

[dependencies]
chrono = "0.4.42"
clap = { version = "4.5.32", features = ["derive"] }
geographiclib-rs = { version = "0.2.5", default-features = false }
predict-rs = "0.1.1"
pyo3 = { version = "0.21.2", optional = true, features = ["abi3-py39"] }
rayon = "1.10.0"
sgp4 = "2.3.0"

[profile.release]
debug = true
strip = true
lto = true
